<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN LOTO</title>
<style>body{font-family:sans-serif;background:#0f172a;color:#fff;padding:15px}h1{color:#facc15;text-align:center}.card{background:#1e293b;padding:14px;border-radius:14px;margin:10px auto;max-width:520px}button{padding:10px 14px;border-radius:10px;border:0;font-weight:900;cursor:pointer;margin:4px}input{padding:12px;border-radius:10px;border:0;width:100%;max-width:520px;box-sizing:border-box;margin:5px 0}.wallet{background:linear-gradient(135deg,#facc15,#f97316);color:#000;padding:18px;border-radius:16px;max-width:520px;margin:10px auto;text-align:center}.tab{display:flex;gap:6px;max-width:520px;margin:auto}.tab button{background:#334155;color:#fff;flex:1}.tab button.on{background:#facc15;color:#000}</style></head><body>
<h1>👑 ADMIN LOTO 5/90</h1><center><input id="code" placeholder="Code admin : 1234"><br><button style="background:#facc15" onclick="load()">ENTRER DANS L'ADMIN</button></center>

<div id="admin" style="display:none">
<div class="wallet"><b>💰 WALLET ADMIN</b><br><span style="font-size:28px" id="benef">0F</span><br><small id="stats">Mises: 0F | Gains payés: 0F</small></div>

<div class="tab"><button id="t1" class="on" onclick="show('tickets')">TICKETS</button><button id="t2" onclick="show('rev')">REVENDEURS</button><button id="t3" onclick="show('recl')">RÉCLAMATIONS</button></div>

<div id="tickets"><div id="list"></div></div>

<div id="rev" style="display:none"><div class="card"><b>➕ CRÉER UN REVENDEUR</b><br><small>Il ne pourra PAS jouer, juste revendre.</small><br>
<input id="rName" placeholder="Nom du revendeur"><input id="rGmail" placeholder="Gmail du revendeur ex: jean@gmail.com"><input id="rPhone" placeholder="Numéro revendeur ex: 01 66 72..."><input id="rSolde" type="number" placeholder="Solde de départ ex: 10000">
<button style="background:#22c55e" onclick="addRev()">CRÉER REVENDEUR ✅</button></div><div id="revList"></div></div>

<div id="recl" style="display:none"><div id="reclList"></div></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,update,push} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const cfg={apiKey:"AIzaSyAT2yhtnH9un6w4cPKsCdijz6ONFqqad4Y",authDomain:"loto590.firebaseapp.com",databaseURL:"https://loto590-default-rtdb.firebaseio.com",projectId:"loto590",storageBucket:"loto590.firebasestorage.app",messagingSenderId:"489454525767",appId:"1:489454525767:web:5919f1dae538ae001b8062"};
const app=initializeApp(cfg);const db=getDatabase(app);
window.show=(t)=>{['tickets','rev','recl'].forEach(x=>document.getElementById(x).style.display=x===t?'block':'none');document.getElementById('t1').className=t==='tickets'?'on':'';document.getElementById('t2').className=t==='rev'?'on':'';document.getElementById('t3').className=t==='recl'?'on':''}
window.load=()=>{if(document.getElementById('code').value!=='1234')return alert('Mauvais code');document.getElementById('admin').style.display='block';
onValue(ref(db,'tickets'),snap=>{let h='';let d=snap.val()||{};let totalMise=0,totalGain=0;Object.entries(d).reverse().forEach(([id,t])=>{totalMise+=Number(t.mise||0);totalGain+=Number(t.gain||0);h+=`<div class="card"><b>${t.code}</b> - ${t.name} (${t.phone})<br>Numéros: ${t.numeros.join(' - ')}<br>Mise: ${t.mise}F - Statut: <b>${t.statut}</b> - Gain: <b>${t.gain||0}F</b><br>${t.date}<br><br><button style="background:#22c55e" onclick="val('${id}','gagne')">✅ GAGNÉ</button><button style="background:#ef4444;color:#fff" onclick="val('${id}','perdu')">❌ PERDU</button><button style="background:#facc15" onclick="gain('${id}')">💰 MONTANT GAGNÉ</button></div>`});document.getElementById('list').innerHTML=h||'Aucun ticket';document.getElementById('benef').textContent=(totalMise-totalGain)+'F';document.getElementById('stats').textContent='Mises: '+totalMise+'F | Gains payés: '+totalGain+'F'});
onValue(ref(db,'revendeurs'),snap=>{let h='<h3>👥 Mes Revendeurs</h3>';let d=snap.val()||{};Object.entries(d).reverse().forEach(([id,r])=>{h+=`<div class="card"><b>${r.name}</b> - ${r.statut}<br>📧 ${r.gmail}<br>📞 ${r.phone}<br>💰 Solde: <b>${r.solde}F</b><br><button style="background:#facc15" onclick="recharge('${id}',${r.solde})">🔋 RECHARGER</button><button style="background:#ef4444;color:#fff" onclick="bloq('${id}')">🚫 BLOQUER</button></div>`});document.getElementById('revList').innerHTML=h});
onValue(ref(db,'reclamations'),snap=>{let h='<h3>📩 Réclamations</h3>';let d=snap.val()||{};Object.entries(d).reverse().forEach(([id,r])=>{h+=`<div class="card">${r.code} : ${r.message}<br><small>${r.date}</small></div>`});document.getElementById('reclList').innerHTML=h})}
window.val=(id,s)=>update(ref(db,'tickets/'+id),{statut:s});
window.gain=(id)=>{let m=prompt('Montant gagné en FCFA ?');if(m)update(ref(db,'tickets/'+id),{gain:Number(m),statut:'gagne'})};
window.addRev=async()=>{let name=document.getElementById('rName').value,gmail=document.getElementById('rGmail').value,phone=document.getElementById('rPhone').value,solde=Number(document.getElementById('rSolde').value||0);if(!name||!gmail||!phone)return alert('Remplis Nom + Gmail + Téléphone');await push(ref(db,'revendeurs'),{name,gmail,phone,solde,statut:'actif',role:'revendeur',peutJouer:false,date:new Date().toLocaleString('fr-FR')});alert('✅ Revendeur créé ! Il ne peut pas jouer, juste revendre.')};
window.recharge=(id,oldSolde)=>{let m=prompt('Recharger combien ? Ex: 20000');if(m)update(ref(db,'revendeurs/'+id),{solde:oldSolde+Number(m)})};
window.bloq=(id)=>update(ref(db,'revendeurs/'+id),{statut:'bloqué'});
</script></body></html>
