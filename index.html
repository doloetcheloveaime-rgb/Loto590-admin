<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN LOTO</title>
<style>body{font-family:sans-serif;background:#0f172a;color:#fff;padding:15px}h1{color:#facc15;text-align:center}.card{background:#1e293b;padding:14px;border-radius:14px;margin:10px auto;max-width:520px}button{padding:10px 14px;border-radius:10px;border:0;font-weight:900;cursor:pointer;margin:4px}input{padding:12px;border-radius:10px;border:0;width:100%;max-width:520px;box-sizing:border-box}</style></head><body>
<h1>👑 ADMIN LOTO 5/90</h1><center><input id="code" placeholder="Code admin : 1234"><br><br><button style="background:#facc15" onclick="load()">VOIR LES TICKETS EN DIRECT</button></center>
<div id="list"></div><div id="recl"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,update} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const cfg={apiKey:"AIzaSyAT2yhtnH9un6w4cPKsCdijz6ONFqqad4Y",authDomain:"loto590.firebaseapp.com",databaseURL:"https://loto590-default-rtdb.firebaseio.com",projectId:"loto590",storageBucket:"loto590.firebasestorage.app",messagingSenderId:"489454525767",appId:"1:489454525767:web:5919f1dae538ae001b8062"};
const app=initializeApp(cfg);const db=getDatabase(app);
window.load=()=>{if(document.getElementById('code').value!=='1234')return alert('Mauvais code');
onValue(ref(db,'tickets'),snap=>{let h='';let d=snap.val()||{};Object.entries(d).reverse().forEach(([id,t])=>{h+=`<div class="card"><b>${t.code}</b> - ${t.name} (${t.phone})<br>Numéros: ${t.numeros.join(' - ')}<br>Mise: ${t.mise}F - Statut: <b>${t.statut}</b><br>Gain: <b>${t.gain||0}F</b><br>${t.date}<br><br><button style="background:#22c55e" onclick="val('${id}','gagne')">✅ GAGNÉ</button><button style="background:#ef4444;color:#fff" onclick="val('${id}','perdu')">❌ PERDU</button><button style="background:#facc15" onclick="gain('${id}')">💰 MONTANT GAGNÉ</button></div>`});document.getElementById('list').innerHTML=h||'Aucun ticket'});
onValue(ref(db,'reclamations'),snap=>{let h='<h2>📩 Réclamations</h2>';let d=snap.val()||{};Object.entries(d).reverse().forEach(([id,r])=>{h+=`<div class="card">${r.code} : ${r.message}<br><small>${r.date}</small></div>`});document.getElementById('recl').innerHTML=h})}
window.val=(id,s)=>update(ref(db,'tickets/'+id),{statut:s});
window.gain=(id)=>{let m=prompt('Montant gagné en FCFA ? Ex: 50000');if(m)update(ref(db,'tickets/'+id),{gain:Number(m),statut:'gagne'})}
</script></body></html>
